[project]
name = "ming3-nvfp4"
version = "0.1.0"
description = "Reproducible NVFP4 quantization and export for Ming 3 audio models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.10.1",
    "einops==0.8.1",
    "fla-core==0.5.2",
    "huggingface-hub>=1.5.0,<2",
    "nvidia-modelopt==0.47.0",
    "openai-whisper==20250625",
    "psutil>=7,<8",
    "safetensors>=0.8.0",
    "soundfile==0.13.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers==5.14.1",
]

[project.optional-dependencies]
speech = ["diffusers", "fasttext-wheel==0.9.2", "inflect", "onnxruntime", "pynini==2.1.7", "x-transformers"]
data = ["pyarrow==26.0.0", "requests==2.34.2"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.14,<0.16"]

[project.scripts]
ming-quant = "ming3_nvfp4.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu128"
# PyPI's pinned Linux torch 2.8.0 wheel is built with CUDA 12.8.
# This is already cached locally; its content hashes are recorded in uv.lock.
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
