[project]
name = "ming3-nvfp4-serving"
version = "0.1.0"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE-2.0"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm==0.31.0",
    "vllm-omni",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchvision==0.28.0",
    "diffusers", "fasttext-wheel==0.9.2", "inflect", "onnxruntime",
    "pynini==2.1.7", "x-transformers", "soundfile==0.13.1",
]

[project.entry-points."vllm.general_plugins"]
ming_nvfp4 = "ming3_serving:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ming3_serving"]

[tool.uv.sources]
vllm-omni = { git = "https://github.com/inclusionAI/vllm-omni.git", rev = "41edeb7febf74e747fd616c016c40caab2d6c53f" }
vllm = { index = "vllm-release" }
torch = { index = "vllm-release" }
torchaudio = { index = "vllm-release" }
torchvision = { index = "vllm-release" }

[[tool.uv.index]]
name = "vllm-release"
url = "https://pypi.org/simple"
explicit = true
