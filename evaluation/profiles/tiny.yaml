pipeline: bailing_moe_v3_audio_thinker_only
async_chunk: true
trust_remote_code: false
distributed_executor_backend: mp
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: false
stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 256
    max_model_len: 16384
    max_num_batched_tokens: 65536
    # Reserve headroom for compiled prefill and NVFP4 workspaces; this limits
    # allocated KV-cache memory, not GPU compute utilization or batch capacity.
    gpu_memory_utilization: 0.80
    enforce_eager: false
    compilation_config:
      mode: 3
      cudagraph_mode: FULL_AND_PIECEWISE
      cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32, 64, 96, 128, 160, 192, 224, 256]
    async_scheduling: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    logits_processors:
      - ming3_serving.ngram:IncrementalNoRepeatNGramLogitsProcessor
    limit_mm_per_prompt:
      audio: 1
    default_sampling_params:
      temperature: 0.0
      max_tokens: 256
      detokenize: true
      ignore_eos: false
      extra_args:
        no_repeat_ngram_size: 0
platforms: {}
